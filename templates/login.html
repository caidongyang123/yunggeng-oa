<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ company }} OA 系统 - 登录</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">耘</div>
    <h1>{{ company }} OA 系统</h1>
    <p class="login-sub">企业办公自动化平台</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="post" class="login-form">
      <label>用户名</label>
      <input name="username" placeholder="请输入用户名" required autofocus>
      <label>密码</label>
      <input name="password" type="password" placeholder="请输入密码" required>
      <button type="submit">登 录</button>
    </form>
    <div class="login-tip">
      <div>管理员：admin / admin123</div>
      <div>员工示例：zhangsan / 123456</div>
    </div>
  </div>
</body>
</html>
